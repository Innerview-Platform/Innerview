<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(geist-latin.woff2) format('woff2');font-weight:100 900}

.mark{width:64px;height:64px}
.g{background:linear-gradient(100deg,#6aa6ff,#c19bff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:84px;line-height:1.02;letter-spacing:-.02em;margin:0;max-width:960px}
h1 em{padding-right:6px;margin-right:-6px}

.foot{display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#868aa3}
.pill{border:1px solid #2a2f45;border-radius:999px;padding:8px 18px;color:#a7abc0}
