# Production overrides for a single VPS, layered on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# (or put COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in .env and just run
# `docker compose up -d --build`). See docs/DEPLOYMENT.md for the full guide.
#
# Caddy is the only public web entry point. It terminates HTTPS with a Let's Encrypt certificate
# for PUBLIC_HOST (a bare IP works) and proxies to the frontend's nginx, which routes /api,
# /ws-signal, /canvas and /collab to the backend and the collaboration servers.
# Browsers only allow camera/microphone access (and crypto.randomUUID) on HTTPS pages, so the
# interview room does not work over plain http://<ip>.

x-required:
  public-host: &public-host ${PUBLIC_HOST:?Set PUBLIC_HOST in .env (the VPS public IP or a domain)}
  jwt-secret: &jwt-secret ${JWT_SECRET:?Set JWT_SECRET in .env}

services:
  caddy:
    image: caddy:2.11
    container_name: innerview-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "7443:7443"
    environment:
      PUBLIC_HOST: *public-host
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - livekit
    restart: unless-stopped
    networks:
      - innerview-network

  frontend:
    build:
      args:
        # The SPA calls /api, /ws-signal, /canvas and /collab on its own origin (https://PUBLIC_HOST),
        # so only LiveKit needs an absolute URL. Caddy serves it with TLS on port 7443.
        VITE_LIVEKIT_URL: wss://${PUBLIC_HOST}:7443

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FRONTEND_URL: https://${PUBLIC_HOST}
      JWT_SECRET: *jwt-secret
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
      # Leave headroom for MySQL, Piston and the Node services on a small VPS.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=40

  mysql:
    environment:
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}

  canvas:
    environment:
      JWT_SECRET: *jwt-secret
      FRONTEND_URL: https://${PUBLIC_HOST}

  editor:
    environment:
      JWT_SECRET: *jwt-secret

  livekit:
    # Production mode: real API keys instead of --dev's devkey/secret, and the public IP advertised
    # to browsers as the WebRTC candidate (inside Docker LiveKit would otherwise announce its
    # container IP). Media flows directly over 7881/tcp and 7882/udp, which must be open.
    command: --bind 0.0.0.0
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${PUBLIC_IP:?Set PUBLIC_IP in .env (the VPS public IPv4 address)}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

volumes:
  caddy-data:
  caddy-config:
