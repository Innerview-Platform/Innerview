<html><body style="margin:0"><div id="root" style="height:100vh"></div><script>window.EXCALIDRAW_ASSET_PATH='/excalidraw/';window.canvasSockets=[];window.canvasMessages=[];window.canvasSends=[];const Native=window.WebSocket;window.WebSocket=class extends Native{constructor(...args){super(...args);window.canvasSockets.push(this);this.addEventListener('message',e=>window.canvasMessages.push(JSON.parse(e.data)));}send(data){window.canvasSends.push(JSON.parse(data));return super.send(data);}};</script><script type="module" src="/whiteboard-review.tsx"></script></body></html>
