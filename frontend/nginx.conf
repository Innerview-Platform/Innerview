# In production Caddy terminates HTTPS in front of this nginx and sends X-Forwarded-Proto: https.
# Pass that through (falling back to this hop's scheme) so the backend builds https:// URLs.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirects use relative Location headers; nginx only knows itself as http://localhost behind Caddy.
    absolute_redirect off;

    # ── Gzip compression ──────────────────────────
    gzip on;
    # Every request arrives through Caddy (with a Via header), and nginx doesn't compress proxied
    # requests by default, so without this nothing reached browsers compressed.
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json image/x-icon;
    gzip_min_length 256;

    # ── Reverse proxy: notifications SSE stream ───
    # Long-lived and unbuffered. The read timeout outlasts the backend's 5-minute SseEmitter timeout,
    # so the backend closes the stream cleanly and the browser's EventSource reconnects.
    location = /api/notifications/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Reverse proxy: REST API ───────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        # Profile photo and resume uploads (5 MB each, see FileUploadService) plus multipart overhead.
        client_max_body_size 6m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Increase timeouts for long-running API calls
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # API responses are never pages for search engines.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Reverse proxy: WebSocket (STOMP signaling) ─
    location /ws-signal/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket connections are long-lived
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Reverse proxy: Excalidraw sync server (shared whiteboard) ─
    # ^~ so uploaded images (e.g. /canvas/uploads/x.png) skip the static-asset regex below.
    location ^~ /canvas/ {
        proxy_pass http://canvas:5858/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 10m;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Whiteboard uploads belong to private interview rooms; keep them out of image search.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Reverse proxy: Hocuspocus (shared code editor + notes) ─
    # HocuspocusProvider connects to the base URL `/collab` without a trailing slash.
    # Match that exact WebSocket path and send it to the editor's root endpoint.
    location = /collab {
        proxy_pass http://editor:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ^~ /collab/ {
        proxy_pass http://editor:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Reverse proxy: Google OAuth2 flow ─────────
    # The browser is redirected to /login/oauth2/code/google by Google,
    # and Spring Security intercepts /oauth2/** for the authorization request.
    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Spring Boot Actuator (health checks) ──────
    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── SPA pages ─────────────────────────────────
    # vite-plugin-seo.ts writes one HTML file per public page (its own title, description, canonical
    # and social tags) and app.html, the shell for everything behind sign-in. The patterns below must
    # match src/app/router.tsx; tests/seo/routes.check.mjs fails when they drift apart.

    # Public, indexable pages (src/seo/site.ts). The content pages are prerendered HTML.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /login {
        add_header Cache-Control "no-cache";
        try_files /login/index.html =404;
    }

    location = /signup {
        add_header Cache-Control "no-cache";
        try_files /signup/index.html =404;
    }

    location = /system-design-mock-interview {
        add_header Cache-Control "no-cache";
        try_files /system-design-mock-interview/index.html =404;
    }

    location = /mock-coding-interview {
        add_header Cache-Control "no-cache";
        try_files /mock-coding-interview/index.html =404;
    }

    location = /mock-interview-with-a-friend {
        add_header Cache-Control "no-cache";
        try_files /mock-interview-with-a-friend/index.html =404;
    }

    location = /mock-interview-feedback-rubric {
        add_header Cache-Control "no-cache";
        try_files /mock-interview-feedback-rubric/index.html =404;
    }

    # Trailing-slash variants of the public pages: one redirect to the canonical URL.
    location ~ ^/(login|signup|system-design-mock-interview|mock-coding-interview|mock-interview-with-a-friend|mock-interview-feedback-rubric)/$ {
        return 301 /$1$is_args$args;
    }

    # Signed-in pages, password reset, interview rooms (/abc-defg-hij, legacy 6-character codes) and
    # the legacy /room/join/:id link: the app shell, never indexed. Access control is the API's job.
    location ~ "^/(interviews(/[^/]+(/feedback)?)?|feedback|problems(/[^/]+)?|settings/profile|u/[^/]+|join|forgot-password|reset-password|room/join/[^/]+|[A-Za-z]{3}-?[A-Za-z]{4}-?[A-Za-z]{3}|[A-Za-z0-9]{6})$" {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        try_files /app.html =404;
    }

    # Old URLs: permanent redirects instead of a client-side hop.
    location = /dashboard { return 301 /$is_args$args; }
    location = /register  { return 301 /signup$is_args$args; }
    location = /profile   { return 301 /settings/profile$is_args$args; }
    location = /settings  { return 301 /settings/profile$is_args$args; }
    location = /room/join { return 301 /join$is_args$args; }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    # Real files only (favicon, icons, og-image). Any other path is a 404 that still renders the
    # SPA's "Page not found" page, instead of a 200 that search engines treat as a duplicate.
    location / {
        try_files $uri =404;
        error_page 404 /app.html;
    }

    location = /app.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Static asset caching ──────────────────────
    # Hashed build output: cache forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Unhashed files (favicon, icons, og-image, Excalidraw fonts): cache, but let changes through.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        try_files $uri =404;
    }
}
