version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: innerview-postgres
    environment:
      POSTGRES_USER: innerview
      POSTGRES_PASSWORD: innerview_pass
      POSTGRES_DB: innerview_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innerview -d innerview_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Redis Engine
  redis:
    image: redis:7.2-alpine
    container_name: innerview-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # 3. DynamoDB Local
# docker-compose.yml
  dynamodb:
   image: amazon/dynamodb-local:latest
   container_name: innerview-dynamodb
   ports:
     - "8000:8000"
   command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
   healthcheck:
     test: ["CMD-SHELL", "curl -f http://localhost:8000/shell/ || exit 1"]
     interval: 10s
     timeout: 3s
     retries: 5
     start_period: 15s

volumes:
  postgres-data:
  redis-data:
  dynamodb-data:
