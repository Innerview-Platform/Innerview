# Production overrides (SPRING_PROFILES_ACTIVE=prod, set by docker-compose.prod.yml).
# Everything else comes from application.yml and the environment variables in .env.
spring:
  jpa:
    show-sql: false

server:
  # The app runs behind Caddy (HTTPS) → nginx → backend. Trust their X-Forwarded-* headers so
  # redirects and the Google OAuth redirect URI ({baseUrl}) use https://<public host>.
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
